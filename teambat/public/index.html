<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TeamBat | Science Based Lifting</title>
  <meta name="description" content="TeamBat — acompanhamento de treinamento baseado em dados. Science Based Lifting.">
  <meta name="theme-color" content="#050505">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icon-180.png">
  <link rel="preload" href="/assets/fonts/unbounded.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/manrope.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="bat" viewBox="0 0 120 64">
        <path d="M60 19.5 62.5 18 65.5 11 70 21 87 5 118 13 103 35 94 26 83 43 74 32 60 59 46 32 37 43 26 26 17 35 2 13 33 5 50 21 54.5 11 57.5 18Z"/>
      </symbol>
    </defs>
  </svg>

  <div id="app">
    <div class="boot" role="status" aria-label="Carregando TeamBat">
      <svg class="boot__bat" aria-hidden="true"><use href="#bat"/></svg>
      <div class="boot__name">TEAM<span>BAT</span></div>
      <div class="boot__bar"><i></i></div>
    </div>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <noscript><p style="padding:24px;color:#fff">Ative o JavaScript para usar o TeamBat.</p></noscript>

  <script src="/js/core.js"></script>
  <script src="/js/charts.js"></script>
  <script src="/js/progress.js"></script>
  <script src="/js/student.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
